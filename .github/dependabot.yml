version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 10
    schedule:
      interval: monthly
    directory: /
    open-pull-requests-limit: 5
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 10
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      pre-commit:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 10
    schedule:
      interval: monthly
    open-pull-requests-limit: 15
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    groups:
      dev-vite:
        dependency-type: development
        patterns:
          - "@vitejs/*"
          - vite*
          - vitest
      # Ionic packages are released together and must stay on the same version.
      ionic:
        patterns:
          - "@ionic/*"
          - ionicons
      vue:
        update-types:
          - minor
          - patch
        patterns:
          - "@vue/test-utils"
          - vue
          - vue-i18n
          - vue-router
          - vue-tsc
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
        exclude-patterns:
          - typescript
      prod-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
