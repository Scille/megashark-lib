name: Cleanup PR builds

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete PR build releases
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - name: Delete releases and tags for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="build-pr${{ github.event.pull_request.number }}-"
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq ".[] | select(.tagName | startswith(\"$prefix\")) | .tagName"); do
            echo "Deleting release/tag: $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
        timeout-minutes: 2
