name: Ci

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit
        timeout-minutes: 2

      - name: Check lint
        run: npm run lint
        timeout-minutes: 2

      - name: Check prettier
        run: npm run prettier:check
        timeout-minutes: 2

      - name: Check knip
        run: npm run knip
        timeout-minutes: 2

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit
        timeout-minutes: 2

      - name: Run tests
        run: npm run test:unit
        timeout-minutes: 2

  publish-build:
    name: Publish build
    needs: [quality, test]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
        timeout-minutes: 2

      - name: Install dependencies
        run: npm install --ignore-scripts
        timeout-minutes: 2

      - name: Build library
        run: npm run build
        timeout-minutes: 3

      - name: Resolve commit info
        id: info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            tag="build-pr${{ github.event.pull_request.number }}-${sha}"
          else
            sha="${{ github.sha }}"
            tag="build-${sha}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        timeout-minutes: 1

      - name: Pack tarball
        id: pack
        run: |
          filename=$(npm pack --silent | tail -n 1)
          renamed="megashark-lib-${{ steps.info.outputs.sha }}.tgz"
          mv "$filename" "$renamed"
          echo "tarball=$renamed" >> "$GITHUB_OUTPUT"
        timeout-minutes: 2

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" \
            "${{ steps.pack.outputs.tarball }}" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.info.outputs.sha }}" \
            --title "${{ steps.info.outputs.tag }}" \
            --notes "Automated build for ${{ steps.info.outputs.sha }}" \
            --prerelease
        timeout-minutes: 2
